# version: "3.8"

services:
  # ─────────────────────────────────────────────
  # Apache Cassandra (single node, dev)
  # ─────────────────────────────────────────────
  cassandra:
    image: cassandra:5.0
    container_name: cassandra-demo
    ports:
      - "9042:9042"           # CQL native transport (driver kết nối qua cổng này)
    environment:
      - CASSANDRA_CLUSTER_NAME=DemoCluster
      - CASSANDRA_DC=datacenter1          # tên data center -> khớp localDataCenter trong client.js
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M                # giới hạn RAM cho môi trường dev
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      # Node sẵn sàng khi cqlsh truy vấn được
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  cassandra_data:
