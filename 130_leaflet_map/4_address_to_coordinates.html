<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet - Tìm Tọa Độ Từ Địa Chỉ (Geocoding)</title>
  <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Roboto', sans-serif; 
      height: 100vh; 
      display: flex; 
      background: #f1f5f9;
      color: #334155;
    }
    
    .sidebar {
      width: 380px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .header {
      padding: 24px 20px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      color: white;
    }

    .header h2 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 13px; opacity: 0.9; margin-top: 6px; }

    .search-box {
      padding: 20px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    .btn-search {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-search:hover { background: #2563eb; }
    .btn-search:disabled { background: #94a3b8; cursor: not-allowed; }

    .loading {
      font-size: 13px;
      color: #64748b;
      margin-top: 10px;
      display: none;
      text-align: center;
    }

    .results {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .result-item {
      padding: 14px 20px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.2s;
    }

    .result-item:hover { background: #f8fafc; }
    .result-item.active { background: #eff6ff; border-left: 4px solid #3b82f6; padding-left: 16px; }

    .result-title { font-weight: 600; font-size: 14px; color: #1e293b; margin-bottom: 4px; }
    .result-desc { font-size: 12px; color: #64748b; line-height: 1.4; }
    .result-coords { font-size: 11px; color: #0ea5e9; margin-top: 6px; font-weight: 500; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #94a3b8;
    }
    .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }

    #map { flex: 1; }

    .custom-popup .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    
    .popup-content h4 { font-size: 14px; color: #1e293b; margin-bottom: 6px; }
    .popup-content p { font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .popup-content code { background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-size: 11px; color: #ea580c; display: block; text-align: center; font-weight: 600; }

    .instruction {
        font-size: 13px;
        background: #fffbeb;
        color: #b45309;
        padding: 12px 20px;
        border-bottom: 1px solid #fde68a;
        line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="header">
      <h2>🔍 Tìm Tọa Độ</h2>
      <p>Chuyển đổi địa chỉ sang Lat/Lng (Geocoding)</p>
    </div>
    
    <div class="instruction">
        💡 <strong>Hai chiều:</strong><br>
        1. Nhập tên địa điểm để lấy tọa độ (Ví dụ: "Hồ Gươm").<br>
        2. Click vào điểm bất kỳ trên bản đồ để xem địa chỉ.
    </div>

    <div class="search-box">
      <div class="input-group">
        <input type="text" id="addressInput" placeholder="Nhập địa chỉ cần tìm..." autocomplete="off" onkeypress="handleKeyPress(event)">
        <button class="btn-search" id="searchBtn" onclick="searchAddress()">Tìm</button>
      </div>
      <div class="loading" id="loadingIndicator">⏳ Đang tìm kiếm qua Nominatim API...</div>
    </div>

    <div class="results" id="resultsList">
      <div class="empty-state">
        <i>🗺️</i>
        <p>Chưa có kết quả tìm kiếm</p>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="libs/leaflet/leaflet.js"></script>
  <script>
    // 1. Khởi tạo bản đồ
    const map = L.map('map', {
        zoomControl: false
    }).setView([16.0, 106.0], 6);

    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let currentMarker = null;

    // Lắng nghe sự kiện click trên map để Inverse Geocoding (Lấy địa chỉ từ tọa độ)
    map.on('click', function(e) {
        reverseGeocode(e.latlng.lat, e.latlng.lng);
    });

    // 2. Hàm xử lý nhấn Enter
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            searchAddress();
        }
    }

    // 3. Hàm Geocoding: Địa chỉ -> Tọa độ
    async function searchAddress() {
        const input = document.getElementById('addressInput').value.trim();
        if (!input) return;

        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loadingIndicator');
        const resultsList = document.getElementById('resultsList');

        searchBtn.disabled = true;
        loading.style.display = 'block';
        resultsList.innerHTML = '';

        try {
            // Sử dụng Nominatim API của OpenStreetMap (Miễn phí, không cần key)
            // countrycodes=vn để ưu tiên kết quả ở VN
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input)}&countrycodes=vn&limit=10`);
            const data = await response.json();

            if (data.length === 0) {
                resultsList.innerHTML = `
                  <div class="empty-state">
                    <i>❌</i>
                    <p>Không tìm thấy địa điểm này</p>
                  </div>`;
                return;
            }

            renderResults(data);
            
            // Tự động chọn kết quả đầu tiên
            selectLocation(data[0], 0);

        } catch (error) {
            resultsList.innerHTML = `
              <div class="empty-state" style="color:#ef4444;">
                <i>⚠️</i>
                <p>Lỗi kết nối API. Vui lòng thử lại.</p>
              </div>`;
        } finally {
            searchBtn.disabled = false;
            loading.style.display = 'none';
        }
    }

    // 4. Hàm Inverse Geocoding: Tọa độ -> Địa chỉ
    async function reverseGeocode(lat, lng) {
        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = `
          <div class="empty-state">
            <p>⏳ Đang quét địa chỉ tại điểm click...</p>
          </div>`;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
            const data = await response.json();

            if (data && data.display_name) {
                // Tạo một object giả lập cấu trúc data của hàm search để tái sử dụng selectLocation
                const mockResult = {
                    lat: lat,
                    lon: lng,
                    display_name: data.display_name,
                    type: data.type || "Điểm click"
                };
                
                resultsList.innerHTML = '<div style="padding:15px; font-size:13px; color:#64748b; font-weight:600; background:#f8fafc; border-bottom:1px solid #e2e8f0;">📍 KẾT QUẢ CLICK TRÊN BẢN ĐỒ:</div>';
                renderResults([mockResult]);
                selectLocation(mockResult, 0);
            } else {
                resultsList.innerHTML = `
                  <div class="empty-state">
                    <p>Không có thông tin địa chỉ tại khu vực này.</p>
                  </div>`;
            }
        } catch (error) {
             resultsList.innerHTML = `
                  <div class="empty-state" style="color:#ef4444;">
                    <p>Lỗi khi lấy thông tin địa chỉ.</p>
                  </div>`;
        }
    }

    // 5. Hiển thị danh sách kết quả
    function renderResults(data) {
        const resultsList = document.getElementById('resultsList');
        
        data.forEach((item, index) => {
            // Cắt tên chính và mô tả phụ
            const parts = item.display_name.split(',');
            const title = parts[0];
            const desc = parts.slice(1).join(',').trim();
            const lat = parseFloat(item.lat).toFixed(5);
            const lng = parseFloat(item.lon).toFixed(5);

            const div = document.createElement('div');
            div.className = 'result-item';
            div.id = `result-${index}`;
            div.innerHTML = `
                <div class="result-title">${title}</div>
                <div class="result-desc">${desc || item.type}</div>
                <div class="result-coords">Lat: ${lat} | Lng: ${lng}</div>
            `;
            
            div.onclick = () => selectLocation(item, index);
            resultsList.appendChild(div);
        });
    }

    // 6. Chọn 1 kết quả -> Bay đến tọa độ và hiện Popup
    function selectLocation(item, index) {
        // Xóa highlight cũ
        document.querySelectorAll('.result-item').forEach(el => el.classList.remove('active'));
        
        // Highlight mục đang chọn
        const activeItem = document.getElementById(`result-${index}`);
        if(activeItem) activeItem.classList.add('active');

        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lon);

        // Xóa marker cũ nếu có
        if (currentMarker) {
            map.removeLayer(currentMarker);
        }

        // Bay đến tọa độ
        map.flyTo([lat, lng], 15, { duration: 1.5 });

        // Tạo custom icon màu đỏ
        const redIcon = L.divIcon({
            className: '',
            html: `<div style="width:24px;height:24px;background:#ef4444;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 4px 8px rgba(0,0,0,0.3);"></div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 24],
            popupAnchor: [0, -24]
        });

        // Đặt marker mới
        currentMarker = L.marker([lat, lng], { icon: redIcon }).addTo(map);

        // Hiển thị Popup
        const parts = item.display_name.split(',');
        currentMarker.bindPopup(`
            <div class="popup-content">
                <h4>📍 ${parts[0]}</h4>
                <p>${parts.slice(1).join(',').trim() || "Khu vực"}</p>
                <code>${lat.toFixed(5)}, ${lng.toFixed(5)}</code>
            </div>
        `, { className: 'custom-popup' }).openPopup();
    }
  </script>
</body>
</html>
