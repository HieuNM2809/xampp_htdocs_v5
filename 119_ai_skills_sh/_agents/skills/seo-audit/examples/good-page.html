<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- SEO FIX: Thêm lang attribute -->
  <meta charset="UTF-8">

  <!-- SEO FIX: Thêm viewport cho mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO FIX: Title tối ưu 50-60 ký tự -->
  <title>Shop Sản Phẩm Chất Lượng — Giá Tốt Nhất Việt Nam</title>

  <!-- SEO FIX: Thêm meta description 150-160 ký tự -->
  <meta name="description" content="Shop cung cấp sản phẩm chất lượng cao với giá tốt nhất. Giao hàng toàn quốc, đổi trả miễn phí trong 30 ngày. Mua ngay hôm nay!">

  <!-- SEO FIX: Thêm canonical URL -->
  <link rel="canonical" href="https://www.example.com/">

  <!-- SEO FIX: Thêm Open Graph tags -->
  <meta property="og:title" content="Shop Sản Phẩm Chất Lượng — Giá Tốt Nhất Việt Nam">
  <meta property="og:description" content="Shop cung cấp sản phẩm chất lượng cao với giá tốt nhất. Giao hàng toàn quốc.">
  <meta property="og:image" content="https://www.example.com/og-image.jpg">
  <meta property="og:url" content="https://www.example.com/">
  <meta property="og:type" content="website">

  <!-- SEO FIX: Schema markup JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Shop Chất Lượng",
    "description": "Cung cấp sản phẩm chất lượng cao giá tốt",
    "url": "https://www.example.com"
  }
  </script>

  <link rel="stylesheet" href="style.min.css">
  <!-- SEO FIX: Dùng file CSS đã minify -->
</head>
<body>

  <!-- SEO FIX: Thêm h1 duy nhất, rõ ràng -->
  <h1>Chào Mừng Đến Với Shop Sản Phẩm Chất Lượng</h1>

  <!-- SEO FIX: Thêm alt text mô tả cho ảnh + lazy loading + WebP -->
  <img
    src="banner.webp"
    alt="Banner quảng cáo sản phẩm chất lượng cao"
    width="1200"
    height="600"
  >

  <h2>Sản Phẩm Nổi Bật</h2>
  <p>Chúng tôi cung cấp các sản phẩm chất lượng cao với giá tốt nhất thị trường.</p>

  <!-- SEO FIX: Ảnh sản phẩm có alt + lazy loading -->
  <img src="product1.webp" alt="Sản phẩm 1 - Áo thun nam cao cấp" loading="lazy" width="400" height="400">
  <img src="product2.webp" alt="Sản phẩm 2 - Quần jeans nữ thời trang" loading="lazy" width="400" height="400">

  <!-- SEO FIX: Sửa heading hierarchy h2→h3, không nhảy sang h4 -->
  <h3>Liên Hệ Ngay</h3>
  <p>Email: <a href="mailto:info@example.com">info@example.com</a></p>

  <script src="main.min.js" defer></script>
  <!-- SEO FIX: JS minify + defer để không block render -->

</body>
</html>
