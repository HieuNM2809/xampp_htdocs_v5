<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>08 - GeoJSON Polygon (Choropleth)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: Segoe UI, sans-serif; }
  #header { padding: 12px 20px; background: #e91e63; color: #fff; }
  #map { height: calc(100vh - 60px); }
  a { color: #fff; }
  .info {
    padding: 8px 12px;
    background: rgba(255,255,255,0.95);
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    font-size: 13px;
  }
  .info h4 { margin: 0 0 4px 0; color: #e91e63; }
  .legend { line-height: 22px; }
  .legend i {
    width: 18px; height: 18px;
    display: inline-block;
    margin-right: 6px;
    opacity: 0.8;
  }
</style>
</head>
<body>
<div id="header">
  <a href="index.html">← Quay lại</a> &nbsp;|&nbsp;
  <b>08 - GeoJSON Polygon</b> - Choropleth doanh số theo quận
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([10.78, 106.69], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // === GeoJSON: chuẩn dữ liệu địa lý mở (RFC 7946) ===
  // Polygon coordinates dạng: [[ [lng,lat], [lng,lat], ... ]]
  // LƯU Ý: GeoJSON dùng thứ tự [longitude, latitude] - ngược với Leaflet!
  // Ở thực tế bạn sẽ load từ file .geojson hoặc API:
  //   fetch('hcm-districts.geojson').then(r=>r.json()).then(data => ...)
  const districtsGeoJSON = {
    type: 'FeatureCollection',
    features: [
      {
        type: 'Feature',
        properties: { name: 'Quận 1', sales: 980 },
        geometry: {
          type: 'Polygon',
          coordinates: [[[106.692,10.770],[106.715,10.770],[106.715,10.788],[106.692,10.788],[106.692,10.770]]]
        }
      },
      {
        type: 'Feature',
        properties: { name: 'Quận 3', sales: 720 },
        geometry: {
          type: 'Polygon',
          coordinates: [[[106.675,10.775],[106.692,10.775],[106.692,10.795],[106.675,10.795],[106.675,10.775]]]
        }
      },
      {
        type: 'Feature',
        properties: { name: 'Quận 5', sales: 450 },
        geometry: {
          type: 'Polygon',
          coordinates: [[[106.660,10.755],[106.680,10.755],[106.680,10.775],[106.660,10.775],[106.660,10.755]]]
        }
      },
      {
        type: 'Feature',
        properties: { name: 'Quận 7', sales: 320 },
        geometry: {
          type: 'Polygon',
          coordinates: [[[106.705,10.720],[106.735,10.720],[106.735,10.745],[106.705,10.745],[106.705,10.720]]]
        }
      },
      {
        type: 'Feature',
        properties: { name: 'Quận 10', sales: 580 },
        geometry: {
          type: 'Polygon',
          coordinates: [[[106.660,10.770],[106.680,10.770],[106.680,10.785],[106.660,10.785],[106.660,10.770]]]
        }
      }
    ]
  };

  // Hàm chọn màu theo doanh số (đơn vị triệu đồng)
  function getColor(sales) {
    return sales > 800 ? '#880e4f' :
           sales > 600 ? '#c2185b' :
           sales > 400 ? '#e91e63' :
           sales > 200 ? '#f48fb1' : '#fce4ec';
  }

  // Style mặc định mỗi polygon
  function style(feature) {
    return {
      fillColor: getColor(feature.properties.sales),
      weight: 2,
      color: '#fff',
      fillOpacity: 0.7
    };
  }

  // Khi hover: highlight đậm hơn + cập nhật info box
  function highlight(e) {
    const layer = e.target;
    layer.setStyle({ weight: 4, color: '#333', fillOpacity: 0.9 });
    layer.bringToFront();
    info.update(layer.feature.properties);
  }

  function resetHighlight(e) {
    geojsonLayer.resetStyle(e.target);
    info.update();
  }

  function zoomToFeature(e) {
    map.fitBounds(e.target.getBounds());
  }

  // Gắn event lên mỗi feature
  function onEachFeature(feature, layer) {
    layer.on({
      mouseover: highlight,
      mouseout: resetHighlight,
      click: zoomToFeature
    });
    layer.bindTooltip(feature.properties.name, { sticky: true });
  }

  const geojsonLayer = L.geoJSON(districtsGeoJSON, {
    style: style,
    onEachFeature: onEachFeature
  }).addTo(map);

  // === Control: Info box góc trên phải ===
  const info = L.control({ position: 'topright' });
  info.onAdd = function() {
    this._div = L.DomUtil.create('div', 'info');
    this.update();
    return this._div;
  };
  info.update = function(props) {
    this._div.innerHTML = '<h4>Doanh số theo quận</h4>' +
      (props ? `<b>${props.name}</b>: ${props.sales} triệu`
             : 'Rê chuột vào quận để xem');
  };
  info.addTo(map);

  // === Legend chú thích ===
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'info legend');
    const grades = [0, 200, 400, 600, 800];
    div.innerHTML = '<b>Triệu đồng</b><br>';
    for (let i = 0; i < grades.length; i++) {
      const from = grades[i];
      const to = grades[i + 1];
      div.innerHTML += `<i style="background:${getColor(from + 1)}"></i>${from}${to ? '–'+to : '+'}<br>`;
    }
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
