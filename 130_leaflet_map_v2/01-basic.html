<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>01 - Bản đồ cơ bản</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { margin: 0; font-family: Segoe UI, sans-serif; }
  #header { padding: 12px 20px; background: #e91e63; color: #fff; }
  #map { height: calc(100vh - 60px); }
  a { color: #fff; }
</style>
</head>
<body>
<div id="header">
  <a href="index.html">← Quay lại</a> &nbsp;|&nbsp;
  <b>01 - Bản đồ cơ bản</b> - Khởi tạo map đơn giản nhất
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Bước 1: Khởi tạo map gắn vào thẻ có id="map"
  // setView([lat, lng], zoom) - toạ độ trung tâm TP.HCM, zoom 13
  const map = L.map('map').setView([10.762622, 106.660172], 13);

  // Bước 2: Thêm tile layer - "lớp ảnh" nền bản đồ
  // Đây là OpenStreetMap miễn phí, không cần API key
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Vậy là xong! Map đã hiển thị.
  console.log('Map đã khởi tạo:', map);
</script>
</body>
</html>
