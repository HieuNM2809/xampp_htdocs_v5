<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Level 3 — Server-Sent Events</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      h1 { font-size: 20px; }
      #log { background: #0b1021; color: #7CFC98; padding: 12px; border-radius: 8px;
             height: 320px; overflow: auto; font-family: ui-monospace, monospace; font-size: 13px; }
      .muted { color: #666; font-size: 13px; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Server-Sent Events (SSE)</h1>
    <p class="muted">
      Trình duyệt dùng <code>EventSource</code> để nhận sự kiện server đẩy về theo thời gian thực.
      Mỗi giây server gửi một event <code>tick</code>.
    </p>
    <p><button id="stop">Ngắt kết nối</button></p>
    <div id="log"></div>

    <script>
      const log = document.getElementById('log');
      const add = (msg) => {
        log.innerHTML += msg + '\n';
        log.scrollTop = log.scrollHeight;
      };

      // EventSource: tự kết nối tới /events, tự reconnect nếu rớt mạng.
      const es = new EventSource('/events');

      es.addEventListener('open', () => add('· đã kết nối tới /events'));

      // Lắng nghe event có tên "tick" (server đặt qua "event: tick")
      es.addEventListener('tick', (e) => {
        const data = JSON.parse(e.data);
        add(`tick #${data.count} @ ${data.time}`);
      });

      es.addEventListener('done', () => {
        add('· server báo done, đóng kết nối');
        es.close();
      });

      es.addEventListener('error', () => add('· lỗi/đóng kết nối (EventSource sẽ tự thử lại nếu còn mở)'));

      document.getElementById('stop').onclick = () => {
        es.close();
        add('· bạn đã ngắt kết nối thủ công');
      };
    </script>
  </body>
</html>
